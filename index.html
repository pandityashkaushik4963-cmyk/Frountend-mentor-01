<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./Media.css">
  <title>Frontend Mentor | Results summary component</title>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="left">
        <h2 id="result-title">Your Result</h2>
        <div class="cercle">
          <h2>76</h2>
          <h5>of 100</h5>
        </div>
        <div class="desc">
          <h3>Great</h3>
          <p>You scored higher than 65% of the people who have taken these tests.</p>
        </div>
      </div>
      <div class="right">
        <h2>Summary</h2>
        <div class="summary">
          <div class="show" id="reaction">
            <div>
              <img src="assets/images/icon-reaction.svg" alt="Reaction">
              <h3>Reaction</h3>
            </div>
            <p>86 <span>/100</span></p>
          </div>
          <div class="show" id="memory">
            <div>
              <img src="assets/images/icon-memory.svg" alt="Memory">
              <h3>Memory</h3>
            </div>
            <p>83 <span>/100</span></p>
          </div>
          <div class="show" id="verbal">
            <div>
              <img src="assets/images/icon-verbal.svg" alt="Verbal">
              <h3>Verbal</h3>
            </div>
            <p>72 <span>/100</span></p>
          </div>
          <div class="show" id="visual">
            <div>
              <img src="assets/images/icon-visual.svg" alt="Visual">
              <h3>Visual</h3>
            </div>
            <p>58 <span>/100</span></p>
          </div>
        </div>
        <button>Continue</button>
      </div>
    </div>
  </div>

</body>
</html>
